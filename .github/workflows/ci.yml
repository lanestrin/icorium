name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's image ships Chromium and its system libraries, which saves ~9 minutes per run.
    # Its version must match @playwright/test in package-lock.json (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the Playwright version matches the container image
        run: |
          test "$(npx playwright --version)" = "Version 1.65.0" || {
            echo "::error::@playwright/test is now $(npx playwright --version). Update the container image tag in ci.yml to match."
            exit 1
          }

      # Unit + API tests, client type-check and build, browser tests
      - run: npm run verify

      - name: Upload the browser test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
