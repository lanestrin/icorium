name: Release

# Keeps one "chore: release x.y.z" PR open with the next version and changelog,
# worked out from the squash-merged PR titles (fix: patch, feat: minor,
# feat!: major). Merging that PR creates the vX.Y.Z tag and GitHub Release.
# Runs on every push to main; "Run workflow" in the Actions tab retries a
# failed run without another merge.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A personal token, not GITHUB_TOKEN: GitHub does not run CI on PRs that
      # GITHUB_TOKEN opens, so the release PR's checks would never run.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
