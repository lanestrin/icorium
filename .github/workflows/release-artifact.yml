name: Release artifact

# Builds the deployable zip for a published release from its exact tag, checks that
# the unzipped copy installs and builds the static site, and attaches the zip, its
# .sha256 and its manifest to that GitHub Release. "Run workflow" with a tag rebuilds an
# existing release's assets; only releases that include this workflow's release tooling
# (scripts/build-release.mjs and release/allowlist.txt) can be built. It never pushes,
# deploys or creates repositories.
#
# The build job's only output is the workflow artifact "release-icorium-vX.Y.Z"
# (zip, .sha256, manifest). A later publish job can consume that artifact without
# changing how releases are built.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (a release that includes the release tooling), for example v1.20.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifact-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      name: ${{ steps.release.outputs.name }}
    # The tag is untrusted input: it reaches scripts only through this variable.
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the tag has a published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must look like v1.2.3."
            exit 1
          fi
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != "false" ]; then
            echo "::error::$TAG has no published GitHub Release."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=icorium-$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the checkout is the tagged commit
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Unit + API tests, client type-check and build, on the exact release.
      - run: npm run verify

      - name: Build the release zip
        run: node scripts/build-release.mjs "$TAG" "$RUNNER_TEMP/release"

      # The release is a static site: it must install and build, and the build must hold
      # every page and the bundled sample files (A-001 is the first row of partner A's sample).
      - name: Install and build the unzipped release
        run: |
          mkdir -p "$RUNNER_TEMP/extract"
          cd "$RUNNER_TEMP/extract"
          unzip -q "$RUNNER_TEMP/release/icorium-$TAG.zip"
          cd "icorium-$TAG"
          npm ci
          npm run build -w client
          for page in client/dist/index.html client/dist/generator/index.html client/dist/architecture/index.html; do
            if [ ! -f "$page" ]; then
              echo "::error::The unzipped release's build has no $page."
              exit 1
            fi
          done
          if ! grep -rqF 'A-001' client/dist/assets; then
            echo "::error::The unzipped release's build does not include the sample files."
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ steps.release.outputs.name }}
          path: |
            ${{ runner.temp }}/release/${{ steps.release.outputs.name }}.zip
            ${{ runner.temp }}/release/${{ steps.release.outputs.name }}.zip.sha256
            ${{ runner.temp }}/release/${{ steps.release.outputs.name }}.manifest.json
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.build.outputs.name }}
          path: assets

      - name: Attach the zip, checksum and manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          NAME: ${{ needs.build.outputs.name }}
        run: |
          gh release upload "$TAG" "assets/$NAME.zip" "assets/$NAME.zip.sha256" "assets/$NAME.manifest.json" \
            --clobber --repo "$GITHUB_REPOSITORY"
